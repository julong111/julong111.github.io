# On every push to the julong branch this script is executed
# julong only keeps source files; compilation & minification all happen here,
# the result is deployed to GitHub Pages via the official Pages actions.
name: Build and deploy GH Pages

on:
  workflow_dispatch:
  push:
    branches:
      - julong

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install minify tools
        run: npm install terser clean-css-cli -g

      - name: Minify static assets
        run: |
          set -e
          PREFIX=static/production
          rm -rf "$PREFIX"
          while IFS= read -r -d '' file; do
            out="$PREFIX/${file#static/}"
            mkdir -p "$(dirname "$out")"
            terser "$file" -o "$out" --compress --mangle
          done < <(find static/js -name '*.js' -type f -print0)
          while IFS= read -r -d '' file; do
            out="$PREFIX/${file#static/}"
            mkdir -p "$(dirname "$out")"
            cleancss -o "$out" "$file"
          done < <(find static/css -name '*.css' -type f -print0)

      - name: create CNAME dynamically
        run: |
          if [ -n "${CNAME}" ]; then
            echo ${CNAME} > static/CNAME
          fi
        env:
          CNAME: ${{ secrets.GH_PAGES_CNAME }}

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build site
        run: zola build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4