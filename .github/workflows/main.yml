# On every push to the julong branch this script is executed
# julong only keeps source files; compilation & minification all happen here,
# the result is published to the gh-pages branch.
name: Build and deploy GH Pages

on:
  push:
    branches:
      - julong

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install minify tools
        run: npm install terser clean-css-cli -g

      - name: Minify static assets
        run: |
          set -e
          PREFIX=static/production
          rm -rf "$PREFIX"
          while IFS= read -r -d '' file; do
            out="$PREFIX/${file#static/}"
            mkdir -p "$(dirname "$out")"
            terser "$file" -o "$out" --compress --mangle
          done < <(find static/js -name '*.js' -type f -print0)
          while IFS= read -r -d '' file; do
            out="$PREFIX/${file#static/}"
            mkdir -p "$(dirname "$out")"
            cleancss -o "$out" "$file"
          done < <(find static/css -name '*.css' -type f -print0)

      - name: create CNAME dynamically
        run: |
          if [ -n "${CNAME}" ]; then
            echo ${CNAME} > static/CNAME
          fi
        env:
          CNAME: ${{ secrets.GH_PAGES_CNAME }}

      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.21.0
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          # Provide personal access token
          #TOKEN: ${{ secrets.TOKEN }}
          # Or if publishing to the same repo, use the automatic token
          TOKEN: ${{ secrets.GITHUB_TOKEN }}